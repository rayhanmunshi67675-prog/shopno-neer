<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বপ্ন নীড় - কনস্ট্রাকশন সাইট নোটবুক</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Hind Siliguri for Bengali typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/manifest+json;utf8,{
        %22name%22:%22স্বপ্ন%20নীড়%20সাইট%20নোটবুক%22,
        %22short_name%22:%22স্বপ্ন%20নীড়%22,
        %22start_url%22:%22.%22,
        %22display%22:%22standalone%22,
        %22background_color%22:%22#0b0f19%22,
        %22theme_color%22:%22#0b0f19%22,
        %22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/2382/2382461.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]
    }">

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-card-solid: #1e293b;
            --border-color: rgba(255, 255, 255, 0.1);
            --primary-accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --danger-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', 'Segoe UI', sans-serif;
        }

        body {
            background: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 30px;
        }

        /* --- Premium Splash Screen --- */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .splash-logo {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: white;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
            margin-bottom: 20px;
            animation: pulseGlow 2s infinite alternate;
        }

        #splashScreen h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        #splashScreen p {
            font-size: 1.05rem;
            color: var(--text-muted);
        }

        .loader {
            margin-top: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulseGlow { from { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); } to { box-shadow: 0 0 40px rgba(124, 58, 237, 0.8); } }

        /* --- Navigation Bar --- */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 900;
        }

        header .brand {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header .brand-icon {
            color: #3b82f6;
            font-size: 1.5rem;
        }

        .menu-btn {
            font-size: 1.3rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- Glassmorphic Sidebar Menu --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 24px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }

        .sidebar.active { left: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-menu {
            list-style: none;
            margin-top: 24px;
        }

        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.05rem;
            border-radius: 12px;
            transition: 0.3s;
            margin-bottom: 8px;
        }

        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
        }

        .overlay.active { display: block; }

        /* --- Main UI Elements --- */
        main {
            padding: 24px;
            max-width: 950px;
            margin: 0 auto;
        }

        .page-section { display: none; }
        .page-section.active { display: block; }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media(min-width: 820px) {
            .container { grid-template-columns: 1fr 1fr; }
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            padding: 24px;
            border-radius: 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #93c5fd;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }

        .voice-btn-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(15, 23, 42, 0.4);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .btn-mic {
            background: var(--danger-gradient);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-mic.listening {
            animation: pulseMic 1.5s infinite;
        }

        @keyframes pulseMic {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .btn-submit {
            background: var(--accent-gradient);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-print { background: var(--success-gradient); }
        .btn-clear { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color); color: var(--text-muted); }

        .btn-action:hover { opacity: 0.9; }

        /* --- Premium Table Styling --- */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: rgba(15, 23, 42, 0.8);
            color: #93c5fd;
            font-weight: 600;
        }

        th:first-child { border-top-left-radius: 8px; }
        th:last-child { border-top-right-radius: 8px; }

        td { color: var(--text-main); }

        .total-box {
            margin-top: 20px;
            padding: 14px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: right;
            font-size: 1.15rem;
            font-weight: 700;
            color: #f59e0b;
        }

        /* --- Previous Records Style --- */
        .history-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 20px;
            padding: 18px;
        }

        .history-header {
            background: rgba(15, 23, 42, 0.8);
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #93c5fd;
            border: 1px solid var(--border-color);
        }

        @media print {
            .no-print, header, .sidebar, .overlay { display: none !important; }
            body { background: white; color: black; }
            .card { background: white; border: none; box-shadow: none; color: black; }
            th { background: #f1f5f9; color: black; }
            td { color: black; border-color: #ccc; }
            .total-box { background: #f8fafc; color: black; border-color: #ccc; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splashScreen">
        <div class="splash-logo">
            <i class="fa-solid fa-house-chimney"></i>
        </div>
        <h1>স্বপ্ন নীড়</h1>
        <p>সাইট খরচ ব্যবস্থাপনা সিস্টেম</p>
        <div class="loader"></div>
    </div>

    <!-- Header Navbar -->
    <header class="no-print">
        <div class="brand">
            <i class="fa-solid fa-house-chimney brand-icon"></i> স্বপ্ন নীড়
        </div>
        <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
    </header>

    <!-- Sidebar Menu & Overlay -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 style="color: white; font-size: 1.2rem;">মেনু</h3>
            <i class="fa-solid fa-xmark" onclick="toggleSidebar()" style="cursor: pointer; font-size: 1.2rem; color: var(--text-muted);"></i>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#" class="active" onclick="showPage('homePage')"><i class="fa-solid fa-house"></i> আজকের হিসাব (Home)</a></li>
            <li><a href="#" onclick="showPage('historyPage')"><i class="fa-solid fa-clock-rotate-left"></i> Previous Record</a></li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <main>
        <!-- Home Page -->
        <div id="homePage" class="page-section active">
            <div class="container">
                <!-- Input Card -->
                <div class="card no-print">
                    <h3><i class="fa-solid fa-pen-to-square"></i> আজকের খরচ যোগ করুন</h3>
                    <br>
                    
                    <div class="voice-btn-container">
                        <button type="button" class="btn-mic" id="micBtn">
                            <i class="fa-solid fa-microphone"></i> ভয়েস দিয়ে বলুন
                        </button>
                        <span id="voiceStatus" style="font-size: 0.85rem; color: var(--text-muted);">মাইক চাপুন ও কথা বলুন</span>
                    </div>

                    <form id="expenseForm">
                        <div class="form-group">
                            <label>তারিখ</label>
                            <input type="date" id="expDate" required>
                        </div>
                        <div class="form-group">
                            <label>বিবরণ / কাকে দেওয়া হলো</label>
                            <input type="text" id="expDesc" placeholder="যেমন: রাজমিস্ত্রিকে অগ্রিম দেওয়া হলো" required>
                        </div>
                        <div class="form-group">
                            <label>টাকার পরিমাণ (৳)</label>
                            <input type="number" id="expAmount" placeholder="যেমন: ৫০০০" required>
                        </div>
                        <button type="submit" class="btn-submit"><i class="fa-solid fa-plus"></i> যুক্ত করুন</button>
                    </form>
                </div>

                <!-- Table Output Card -->
                <div class="card">
                    <div class="actions-bar no-print">
                        <button class="btn-action btn-print" onclick="window.print()">
                            <i class="fa-solid fa-print"></i> প্রিন্ট / PDF
                        </button>
                        <button class="btn-action btn-clear" onclick="clearTodayData()">
                            <i class="fa-solid fa-trash"></i> আজকের দিন মুছুন
                        </button>
                    </div>

                    <h3 style="justify-content: center; margin-bottom: 4px; color: white;">আজকের খরচের হিসাব</h3>
                    <p id="todayDateLabel" style="text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;"></p>
                    
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>সময়</th>
                                <th>বিবরণ</th>
                                <th>পরিমাণ (৳)</th>
                                <th class="no-print">অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>

                    <div class="total-box">
                        মোট খরচ: <span id="totalAmount" style="color: #60a5fa;">০</span> ৳
                    </div>
                </div>
            </div>
        </div>

        <!-- History Page -->
        <div id="historyPage" class="page-section">
            <div class="card">
                <h3 style="margin-bottom: 18px; color: white;"><i class="fa-solid fa-folder-open"></i> পূর্ববর্তী দিনের রেকর্ডসমূহ (Previous Records)</h3>
                <div id="historyContainer">
                    <p style="text-align: center; color: var(--text-muted);">কোনো পূর্ববর্তী রেকর্ড পাওয়া যায়নি।</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Splash Screen Timeout ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 1800);
        });

        // --- Sidebar Navigation ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.sidebar-menu a').forEach(link => link.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            if(event.target.tagName === 'A') event.target.classList.add('active');
            
            toggleSidebar();
            if(pageId === 'historyPage') renderHistory();
        }

        // --- Auto Midnight Shift & Date Update Logic ---
        const getTodayString = () => new Date().toISOString().split('T')[0];

        function checkMidnightMigration() {
            const lastSavedDate = localStorage.getItem('lastSavedDate');
            const today = getTodayString();

            if (lastSavedDate && lastSavedDate !== today) {
                let todayExpenses = JSON.parse(localStorage.getItem('todayExpenses')) || [];
                if (todayExpenses.length > 0) {
                    let historyRecords = JSON.parse(localStorage.getItem('historyRecords')) || [];
                    historyRecords.unshift({
                        date: lastSavedDate,
                        items: todayExpenses
                    });
                    localStorage.setItem('historyRecords', JSON.stringify(historyRecords));
                    localStorage.setItem('todayExpenses', JSON.stringify([]));
                }
            }
            localStorage.setItem('lastSavedDate', today);
        }

        checkMidnightMigration();

        // --- Set Current Date Automatically ---
        const currentDateStr = getTodayString();
        document.getElementById('expDate').value = currentDateStr;
        document.getElementById('todayDateLabel').innerText = "তারিখ: " + new Date().toLocaleDateString('bn-BD', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        let todayExpenses = JSON.parse(localStorage.getItem('todayExpenses')) || [];

        function renderExpenses() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let total = 0;

            todayExpenses.forEach((item, index) => {
                total += parseFloat(item.amount);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td style="color: var(--text-muted); font-size: 0.85rem;">${item.time}</td>
                    <td>${item.desc}</td>
                    <td style="font-weight: 600; color: #60a5fa;">${item.amount} ৳</td>
                    <td class="no-print" style="text-align:center;">
                        <button onclick="deleteTodayItem(${index})" style="color: #ef4444; border: none; background: none; cursor: pointer;">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalAmount').innerText = total.toLocaleString('bn-BD');
            localStorage.setItem('todayExpenses', JSON.stringify(todayExpenses));
        }

        document.getElementById('expenseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const date = document.getElementById('expDate').value;
            const desc = document.getElementById('expDesc').value;
            const amount = document.getElementById('expAmount').value;
            const time = new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });

            todayExpenses.push({ date, desc, amount, time });
            renderExpenses();

            document.getElementById('expDesc').value = '';
            document.getElementById('expAmount').value = '';
        });

        function deleteTodayItem(index) {
            todayExpenses.splice(index, 1);
            renderExpenses();
        }

        function clearTodayData() {
            if(confirm('আজকের তালিকা মুছে ফেলতে চান?')) {
                todayExpenses = [];
                renderExpenses();
            }
        }

        // --- History / Previous Record Logic ---
        function renderHistory() {
            const historyContainer = document.getElementById('historyContainer');
            let historyRecords = JSON.parse(localStorage.getItem('historyRecords')) || [];

            if (historyRecords.length === 0) {
                historyContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">কোনো পূর্ববর্তী রেকর্ড পাওয়া যায়নি।</p>';
                return;
            }

            historyContainer.innerHTML = '';
            historyRecords.forEach((record, idx) => {
                let dayTotal = record.items.reduce((sum, item) => sum + parseFloat(item.amount), 0);
                let cardHtml = `
                    <div class="history-card">
                        <div class="history-header">
                            <span><i class="fa-solid fa-calendar-day"></i> তারিখ: ${record.date}</span>
                            <span style="color: #f59e0b;">মোট: ${dayTotal.toLocaleString('bn-BD')} ৳</span>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>সময়</th>
                                    <th>বিবরণ</th>
                                    <th>পরিমাণ (৳)</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                record.items.forEach((item, i) => {
                    cardHtml += `
                        <tr>
                            <td>${i + 1}</td>
                            <td style="color: var(--text-muted); font-size: 0.85rem;">${item.time}</td>
                            <td>${item.desc}</td>
                            <td style="font-weight: 600; color: #60a5fa;">${item.amount} ৳</td>
                        </tr>
                    `;
                });

                cardHtml += `
                            </tbody>
                        </table>
                    </div>
                `;
                historyContainer.innerHTML += cardHtml;
            });
        }

        // --- Voice Recognition & Smart Amount Extraction ---
        const micBtn = document.getElementById('micBtn');
        const voiceStatus = document.getElementById('voiceStatus');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD';

            micBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                    micBtn.classList.add('listening');
                    voiceStatus.innerText = "শুনছি... বলুন";
                } catch(e) {
                    recognition.stop();
                    micBtn.classList.remove('listening');
                }
            });

            recognition.onresult = (event) => {
                let transcript = event.results[0][0].transcript;
                
                // Bangla to English number converter helper
                const bnToEnNums = (str) => {
                    const bnNums = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
                    return str.replace(/[০-৯]/g, d => bnNums.indexOf(d));
                };

                let convertedTranscript = bnToEnNums(transcript);

                // Regular expression to find numbers in the text
                let numberMatch = convertedTranscript.match(/\d+/g);

                if (numberMatch && numberMatch.length > 0) {
                    let extractedAmount = numberMatch[numberMatch.length - 1];
                    document.getElementById('expAmount').value = extractedAmount;

                    let cleanDesc = transcript.replace(extractedAmount, '').replace(/টাকা/g, '').trim();
                    document.getElementById('expDesc').value = cleanDesc || transcript;
                } else {
                    document.getElementById('expDesc').value = transcript;
                }

                micBtn.classList.remove('listening');
                voiceStatus.innerText = "কথা রেকর্ড হয়েছে!";
            };

            recognition.onerror = () => micBtn.classList.remove('listening');
            recognition.onend = () => micBtn.classList.remove('listening');
        } else {
            voiceStatus.innerText = "ভয়েস সাপোর্ট নেই";
            micBtn.style.display = 'none';
        }

        renderExpenses();

        // --- Offline Service Worker ---
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(caches.open('shopno-neer-v4').then(c => c.addAll(['./']))));
                self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>
</body>
</html>
